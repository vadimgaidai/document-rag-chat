name: deploy-develop

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-develop
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  HUSKY: 0
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check
      - run: pnpm build
      - run: pnpm build:lambda

      - name: Zip the Lambda bundles
        run: |
          mkdir -p dist
          (cd .output/server && zip -qr ../../dist/web.zip .)
          for h in ingestion dlq; do (cd dist/lambda/$h && zip -qr ../../$h.zip .); done
          ls -la dist/*.zip

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Lambda code
        run: |
          for f in web ingestion dlq; do
            aws lambda update-function-code --function-name document-rag-chat-$f \
              --zip-file fileb://dist/$f.zip --query LastUpdateStatus --output text
          done
          for f in web ingestion dlq; do
            aws lambda wait function-updated --function-name document-rag-chat-$f
          done

      - name: Upload static assets
        run: >-
          aws s3 sync .output/public s3://${{ vars.ASSETS_BUCKET }} --delete --cache-control "public,max-age=31536000,immutable"

      - name: Invalidate CloudFront
        run: >-
          aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*" --query Invalidation.Id --output text
